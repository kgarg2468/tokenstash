<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 394" width="880" height="394" role="img" aria-labelledby="t d">
  <title id="t">How tokenstash works</title>
  <desc id="d">Your agent needs a key and runs tokenstash need. Three outcomes. If the key is stored and this folder is approved, it is written to .env.local and the agent gets a status line, not the value. If the key is stored but this folder is not approved yet, you approve it once in the inbox on localhost, then it is written. If the key is not stored yet, you are notified with a link to a page on localhost, you paste it once, it is stored in your OS keychain, then written to .env.local.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #FFFFFF; stroke: #D0D7DE; }
    .box   { fill: #F6F8FA; stroke: #8C959F; stroke-width: 1.2; }
    .tbox  { fill: #FFFFFF; stroke: #BF6A2B; stroke-width: 2; }
    .h     { font-size: 15px; font-weight: 600; fill: #1F2328; }
    .s     { font-size: 13px; fill: #59636E; }
    .cond  { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; fill: #59636E; }
    .acc   { fill: #A0521C; }
    .line  { stroke: #8C959F; stroke-width: 1.8; fill: none; }
    .head  { fill: #8C959F; }
    .ok    { fill: #1A7F37; }
    .wt    { stroke: #9A6700; }
    .wtf   { fill: #9A6700; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0D1117; stroke: #3D444D; }
      .box   { fill: #161B22; stroke: #6E7681; }
      .tbox  { fill: #0D1117; stroke: #E08A4B; }
      .h     { fill: #E6EDF3; }
      .s, .cond { fill: #9198A1; }
      .acc   { fill: #E08A4B; }
      .line  { stroke: #6E7681; }
      .head  { fill: #6E7681; }
      .ok    { fill: #3FB950; }
      .wt    { stroke: #D29922; }
      .wtf   { fill: #D29922; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="879" height="393" rx="12"/>

  <!-- agent -->
  <rect class="box" x="24" y="165" width="150" height="64" rx="8"/>
  <text class="h" x="99" y="192" text-anchor="middle">Your agent</text>
  <text class="s" x="99" y="213" text-anchor="middle">needs a key</text>
  <line class="line" x1="174" y1="197" x2="202" y2="197" marker-end="url(#ah)"/>

  <!-- tokenstash need -->
  <rect class="tbox" x="206" y="165" width="180" height="64" rx="8"/>
  <text class="h mono acc" x="296" y="192" text-anchor="middle">tokenstash need</text>
  <text class="s mono" x="296" y="213" text-anchor="middle">OPENAI_API_KEY</text>

  <!-- three-way split -->
  <line class="line" x1="386" y1="197" x2="410" y2="197"/>
  <line class="line" x1="410" y1="72" x2="410" y2="322"/>
  <line class="line" x1="410" y1="72" x2="448" y2="72" marker-end="url(#ah)"/>
  <line class="line" x1="410" y1="197" x2="448" y2="197" marker-end="url(#ah)"/>
  <line class="line" x1="410" y1="322" x2="448" y2="322" marker-end="url(#ah)"/>

  <!-- 1: stored and approved -->
  <rect class="box" x="452" y="34" width="404" height="76" rx="8"/>
  <text class="cond" x="474" y="55">STORED · FOLDER APPROVED</text>
  <circle class="ok" cx="484" cy="80" r="10"/>
  <path d="M479.5,80.5 l3.1,3.1 l5.8,-6.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="502" y="80">Written to <tspan class="mono">.env.local</tspan></text>
  <text class="s" x="502" y="99">the agent gets a status line, not the value</text>

  <!-- 2: stored, folder not approved -->
  <rect class="box" x="452" y="159" width="404" height="76" rx="8"/>
  <text class="cond" x="474" y="180">STORED · FOLDER NOT APPROVED YET</text>
  <text class="h" x="474" y="205">You approve it once</text>
  <text class="s" x="474" y="224">in the inbox on localhost, then it's written</text>

  <!-- 3: not stored -->
  <rect class="box" x="452" y="284" width="210" height="76" rx="8"/>
  <text class="cond" x="474" y="305">NOT STORED YET</text>
  <text class="h" x="474" y="330">You're notified</text>
  <text class="s" x="474" y="349">a link to a localhost page</text>
  <line class="line" x1="662" y1="322" x2="682" y2="322" marker-end="url(#ah)"/>

  <rect class="box" x="686" y="284" width="170" height="76" rx="8"/>
  <text class="h" x="706" y="311">You paste it once</text>
  <text class="s" x="706" y="330">it's stored, then</text>
  <text class="s" x="706" y="349">written to <tspan class="mono">.env.local</tspan></text>
</svg>
