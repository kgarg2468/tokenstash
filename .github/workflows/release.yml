name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux builds are static (musl): the glibc builds required glibc 2.39 and would not
          # start on Ubuntu 22.04 / Debian 12 / Amazon Linux 2023. arm64 builds natively on the
          # free public-repo arm runner (no cross).
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-musl,  name: linux-x64,    musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64, musl: true }
          - { os: macos-latest,    target: aarch64-apple-darwin,       name: darwin-arm64 }
          - { os: macos-15-intel,  target: x86_64-apple-darwin,        name: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - if: matrix.musl
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: binary sanity (static on Linux, runs everywhere)
        run: |
          bin=target/${{ matrix.target }}/release/tokenstash
          "$bin" --version
          if [ "${{ matrix.musl }}" = "true" ]; then ldd "$bin" 2>&1 | grep -q 'statically linked\|not a dynamic executable'; fi
      - name: package + checksum
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenstash dist/
          tar -C dist -czf tokenstash-${{ matrix.name }}.tar.gz tokenstash
          shasum -a 256 tokenstash-${{ matrix.name }}.tar.gz > tokenstash-${{ matrix.name }}.tar.gz.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: "See CHANGELOG.md for what changed and how the upgrade behaves."
          files: |
            tokenstash-${{ matrix.name }}.tar.gz
            tokenstash-${{ matrix.name }}.tar.gz.sha256
  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - name: embed release checksums in the package
        # The npm tarball carries the expected digests, so a tampered GitHub asset cannot
        # pass verification unless npm is compromised as well.
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p /tmp/sums && gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir /tmp/sums
          python3 - <<'PY'
          import json, glob, os
          sums = {}
          for f in glob.glob('/tmp/sums/*.sha256'):
              digest = open(f).read().split()[0]
              sums[os.path.basename(f)[:-len('.sha256')]] = digest
          assert len(sums) == 4, sums
          json.dump(sums, open('npm/checksums.json', 'w'), indent=2)
          PY
          cat npm/checksums.json
      - name: brew formula
        # Generated from the same release digests; paste into the tap repo
        # (kgarg2468/homebrew-tokenstash, Formula/tokenstash.rb) or let a later job push it.
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          bash scripts/brew-formula.sh "$GITHUB_REF_NAME" > tokenstash.rb
          cat tokenstash.rb
          gh release upload "$GITHUB_REF_NAME" tokenstash.rb --clobber
      - name: npm publish gate
        # No NPM_TOKEN secret → the release still ships binaries + formula, npm is just skipped.
        id: gate
        env: { T: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -n "$T" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::NPM_TOKEN not set; skipping npm publish"; fi
      - if: steps.gate.outputs.publish == 'true'
        run: cd npm && npm version ${GITHUB_REF_NAME#v} --no-git-tag-version && npm publish --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
  crates:
    # Gated on CARGO_REGISTRY_TOKEN (crates.io trusted publishing is not used here). Without
    # the secret the job is skipped and `cargo install tokenstash` keeps working from --git.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - name: crates.io publish gate
        id: gate
        env: { T: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: |
          if [ -n "$T" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::CARGO_REGISTRY_TOKEN not set; skipping crates.io"; fi
      - if: steps.gate.outputs.publish == 'true'
        # core first; the CLI depends on the published version, so wait for the index.
        run: |
          cargo publish -p tokenstash-core --locked
          for i in $(seq 1 30); do cargo publish -p tokenstash --locked && break; echo "waiting for the index ($i)"; sleep 20; done
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
