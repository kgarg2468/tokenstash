name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  release:
    # Created once, so the four build jobs never race on creating the same release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: tag matches the workspace version
        # v0.2.0 or v0.2.0-rc.1 (a pre-release dry run: npm/PyPI get the rc version, the
        # binary still reports 0.2.0; crates and the tap are skipped for pre-releases).
        run: |
          tag="${GITHUB_REF_NAME#v}"; base="${tag%%-*}"
          cargo=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ "$base" = "$cargo" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo"; exit 1; }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" $pre --generate-notes --notes "See CHANGELOG.md for what changed and how the upgrade behaves."
  build:
    needs: release
    strategy:
      matrix:
        include:
          # Linux builds are static (musl): the glibc builds required glibc 2.39 and would not
          # start on Ubuntu 22.04 / Debian 12 / Amazon Linux 2023. arm64 builds natively on the
          # free public-repo arm runner (no cross).
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  name: linux-x64,   musl: true, ccvar: CC_x86_64_unknown_linux_musl,  cc: x86_64-linux-musl-gcc }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-arm64, musl: true, ccvar: CC_aarch64_unknown_linux_musl, cc: aarch64-linux-musl-gcc }
          - { os: macos-latest,    target: aarch64-apple-darwin,       name: darwin-arm64 }
          - { os: macos-15-intel,  target: x86_64-apple-darwin,        name: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - if: matrix.musl
        # musl-tools installs <arch>-linux-musl-gcc; name it explicitly so cc-rs (bundled
        # SQLite) never falls back to the host glibc compiler.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          command -v ${{ matrix.cc }}
          echo "${{ matrix.ccvar }}=${{ matrix.cc }}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: binary sanity (static on Linux, runs everywhere)
        run: |
          bin=target/${{ matrix.target }}/release/tokenstash
          "$bin" --version
          if [ "${{ matrix.musl }}" = "true" ]; then ldd "$bin" 2>&1 | grep -q 'statically linked\|not a dynamic executable'; fi
      - name: package + checksum
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenstash dist/
          tar -C dist -czf tokenstash-${{ matrix.name }}.tar.gz tokenstash
          shasum -a 256 tokenstash-${{ matrix.name }}.tar.gz > tokenstash-${{ matrix.name }}.tar.gz.sha256
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$GITHUB_REF_NAME" tokenstash-${{ matrix.name }}.tar.gz tokenstash-${{ matrix.name }}.tar.gz.sha256 --clobber
  npm:
    # Five packages: four platform packages (binary only, `os`/`cpu` pinned, no scripts) and
    # the `tokenstash` launcher that lists them as optionalDependencies. No postinstall, so
    # bun / pnpm 10 / --ignore-scripts installs work.
    # Bootstrap (first release): npm trusted publishers can only be configured on packages
    # that exist, so set NPM_TOKEN to a granular token (publish, bypass 2FA, short expiry).
    # Then configure a trusted publisher on all five packages (this repo, release.yml), set
    # the repo variable NPM_TRUSTED_PUBLISHING=true and delete NPM_TOKEN: OIDC with automatic
    # provenance from then on. Never unpublish a version: name@version can never be reused
    # and the launcher pins exact versions; ship a patch release instead.
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }   # no registry-url: it would write an .npmrc with an empty _authToken and break OIDC
      - run: npm install -g npm@11.17.0 && npm --version   # trusted publishing needs ≥ 11.5.1; pinned on purpose
      - name: download release tarballs
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "$GITHUB_REF_NAME" --pattern 'tokenstash-*.tar.gz' --dir /tmp/dist
      - name: npm publish gate
        id: gate
        env: { T: "${{ secrets.NPM_TOKEN }}", OIDC: "${{ vars.NPM_TRUSTED_PUBLISHING }}" }
        run: |
          if [ -n "$T" ]; then
            echo "//registry.npmjs.org/:_authToken=$T" > ~/.npmrc; chmod 600 ~/.npmrc; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$OIDC" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::neither NPM_TOKEN nor NPM_TRUSTED_PUBLISHING set; npm skipped"
          fi
      - name: assemble (and publish when gated on)
        env: { NPM_PUBLISH: "${{ steps.gate.outputs.publish == 'true' && '1' || '' }}" }
        run: scripts/npm-package.sh "${GITHUB_REF_NAME#v}" /tmp/dist /tmp/npm-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: npm-packages, path: /tmp/npm-out, retention-days: 14 }
  crates:
    # Gated on CARGO_REGISTRY_TOKEN (crates.io trusted publishing is not used here). Without
    # the secret the job is skipped and `cargo install tokenstash` keeps working from --git.
    # Never for a pre-release tag: Cargo.toml carries the final version.
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable }
      - name: crates.io publish gate
        id: gate
        env: { T: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: |
          if [ -n "$T" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::CARGO_REGISTRY_TOKEN not set; skipping crates.io"; fi
      - if: steps.gate.outputs.publish == 'true'
        # Token scopes: publish-new (first release of each crate) + publish-update. Each crate
        # is skipped when this version is already on crates.io, so a re-run after a later job
        # failed does not abort here. `cargo publish` blocks until the crate is in the index,
        # so the CLI (which depends on the published core) can follow directly; it is not
        # --locked because cargo rewrites the path dependency for the verification build.
        run: |
          v="${GITHUB_REF_NAME#v}"
          published() { curl -sf -H 'User-Agent: tokenstash-release (github.com/kgarg2468/tokenstash)' "https://crates.io/api/v1/crates/$1/$2" >/dev/null; }
          published tokenstash-core "$v" || cargo publish -p tokenstash-core --locked
          published tokenstash "$v" || cargo publish -p tokenstash
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
