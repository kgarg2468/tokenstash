name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  name: linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: linux-arm64, cross: true }
          - { os: macos-latest,  target: aarch64-apple-darwin,      name: darwin-arm64 }
          - { os: macos-13,      target: x86_64-apple-darwin,       name: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross
        run: cargo install cross --locked
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenstash dist/
          tar -C dist -czf tokenstash-${{ matrix.name }}.tar.gz tokenstash
          if command -v sha256sum >/dev/null; then
            sha256sum tokenstash-${{ matrix.name }}.tar.gz > tokenstash-${{ matrix.name }}.tar.gz.sha256
          else
            shasum -a 256 tokenstash-${{ matrix.name }}.tar.gz > tokenstash-${{ matrix.name }}.tar.gz.sha256
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tokenstash-${{ matrix.name }}.tar.gz
            tokenstash-${{ matrix.name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            tokenstash-${{ matrix.name }}.tar.gz
            tokenstash-${{ matrix.name }}.tar.gz.sha256
  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v4
        with: { pattern: "dist-*", merge-multiple: true, path: dist }
      # Pin every asset's digest INSIDE the npm package: npm and GitHub Releases are
      # independent registries, so the installer verifies against a trust anchor an
      # attacker must compromise separately from the release it tampers with.
      - name: pin checksums into the package
        run: |
          cd npm/bin && python3 - <<'EOF'
          import glob, json, os
          sums = {}
          for f in glob.glob("../../dist/*.sha256"):
              key = os.path.basename(f).removeprefix("tokenstash-").removesuffix(".tar.gz.sha256")
              sums[key] = open(f).read().split()[0]
          assert len(sums) == 4, f"expected 4 platform digests, got {sorted(sums)}"
          open("sums.json", "w").write(json.dumps(sums, indent=2) + "\n")
          print(json.dumps(sums, indent=2))
          EOF
      - run: cd npm && npm version ${GITHUB_REF_NAME#v} --no-git-tag-version && npm publish --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
