name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  name: linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: linux-arm64, cross: true }
          - { os: macos-latest,  target: aarch64-apple-darwin,      name: darwin-arm64 }
          - { os: macos-13,      target: x86_64-apple-darwin,       name: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross
        run: cargo install cross --locked
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenstash dist/
          tar -C dist -czf tokenstash-${{ matrix.name }}.tar.gz tokenstash
      - uses: softprops/action-gh-release@v2
        with: { files: "tokenstash-${{ matrix.name }}.tar.gz" }
  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - run: cd npm && npm version ${GITHUB_REF_NAME#v} --no-git-tag-version && npm publish --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
