name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      # The black-box one: a real binary, a real inbox, a canary that must not appear
      # anywhere but the project's env file. It needs a release build (it greps the binary's
      # own output paths) and its own HOME so nothing touches the runner's keyring.
      - run: cargo build --release --locked -p tokenstash
      - run: scripts/leak-test.sh
